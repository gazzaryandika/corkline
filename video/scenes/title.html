<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Title slide: sits on clip 1's first frame, then clears to reveal it. Rendered per frame via window.render(t). */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, sans-serif; }
  #bg { position: absolute; inset: 0; background: url(../assembly/clip01-first.png) center / cover; }
  #veil { position: absolute; inset: 0; background: linear-gradient(rgba(24,16,52,.62), rgba(24,16,52,.62)), url(../assembly/clip01-first-blur.png) center / cover; } /* pre-blurred: cheaper than backdrop-filter */
  #title { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; color: #fff; }
  .row { display: flex; align-items: center; gap: 40px; }
  .mark { width: 128px; height: 128px; border-radius: 30px; background: linear-gradient(135deg, #0d9488, #7c3aed);
    box-shadow: 0 20px 50px rgba(10,5,30,.45), inset 0 2px 0 rgba(255,255,255,.25); position: relative; }
  .mark svg { position: absolute; inset: 0; }
  .word { font: 700 150px/1 'IBM Plex Mono', monospace; letter-spacing: .02em; text-shadow: 0 10px 40px rgba(10,5,30,.45); }
  .tag { margin-top: 34px; font: 500 36px Inter; letter-spacing: -0.01em; color: rgba(255,255,255,.85); }
  .rule { width: 120px; height: 3px; border-radius: 2px; background: #ffcf9e; margin: 54px 0 34px; opacity: .9; }
  .names { display: flex; gap: 64px; }
  .person { display: grid; justify-items: center; gap: 10px; }
  .person b { font: 600 32px Inter; letter-spacing: -0.01em; color: #fff; }
  .person span { font: 600 20px 'IBM Plex Mono', monospace; letter-spacing: .12em; color: #ffcf9e; }
  .course { margin-top: 46px; font: 600 18px 'IBM Plex Mono', monospace; letter-spacing: .3em; color: #ffcf9e; padding-left: .3em; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="veil"></div>
<div id="title">
  <div class="row">
    <div class="mark"><svg viewBox="0 0 128 128"><path d="M34 44 L64 64 L94 46" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M64 64 L64 92" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="34" cy="44" r="11" fill="#fff"/><circle cx="94" cy="46" r="11" fill="#fff"/>
      <circle cx="64" cy="64" r="11" fill="#fff"/><circle cx="64" cy="92" r="11" fill="#fff"/></svg></div>
    <div class="word">CORKLINE</div>
  </div>
  <div class="tag">A reasoning board for design projects</div>
  <div class="rule"></div>
  <div class="names">
    <div class="person"><b>Nienke van Dok</b><span>5302765</span></div>
    <div class="person"><b>Gazza Ryandika Aditya Putra</b><span>6422608</span></div>
    <div class="person"><b>Ayan Barua</b><span>6491766</span></div>
  </div>
  <div class="course">TU DELFT · IDEM307</div>
</div>
<script>
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const title = document.getElementById('title'), veil = document.getElementById('veil');
  // 0–0.5 s fade in, hold, 5.7–6.5 s clear away to clip 1's first frame
  window.render = (t) => {
    const a = clamp(t / 0.5), out = clamp((t - 5.7) / 0.8), e = out * out * (3 - 2 * out);
    title.style.opacity = a * (1 - e);
    title.style.transform = `translateY(${-40 * e}px) scale(${1 - 0.06 * e})`;
    title.style.filter = `blur(${e * 10}px)`;
    veil.style.opacity = 1 - e;
  };
  window.render(0);
</script>
</body>
</html>
