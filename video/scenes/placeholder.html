  #h { font: 800 76px/1.05 Inter; letter-spacing: -0.035em; }

<body><div id="k"></div><div id="h"></div><div id="s">Placeholder · not made yet</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('k').textContent = q.get('k');
  document.getElementById('h').textContent = q.get('h');
  window.render = () => {};
</script>
